<!DOCTYPE html>
<html lang="en-US">
<head>
    <h1>Recipe Book</h1>
</head>
<body>
    <h2>{{ recipe.name }}</h2>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
        <li>
            {{ ingredient.ingredient.name }}: {{ ingredient.quantity }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
